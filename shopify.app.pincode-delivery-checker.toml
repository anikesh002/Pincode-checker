# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "73c1b6f0b2615e6d2fc80c6716610cee"
application_url = "https://app.animaa.in"
embedded = true
name = "pincode-delivery-checker"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# This app only needs session tokens and webhooks — no product/theme access required
scopes = ""

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # GDPR Mandatory Webhooks
  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  compliance_topics = [ "shop/redact", "customers/redact", "customers/data_request" ]

[auth]
redirect_urls = [
  "https://app.animaa.in/api/auth",
  "https://app.animaa.in/auth/callback",
  "https://app.animaa.in/api/auth/callback",
  "https://app.animaa.in/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
